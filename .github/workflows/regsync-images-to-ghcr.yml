name: Sync Images to GHCR

permissions:
  contents: read

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# =============================================================================
# JOBS
# =============================================================================

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install regsync
        env:
          REGSYNC_VERSION: v0.10.0
          REGSYNC_SHA256: "b9e4799b33f0b89a369a9abb8f1e4c2e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8"
        run: |
          echo "Installing regsync ${REGSYNC_VERSION}..."
          curl -fsSL "https://github.com/regclient/regclient/releases/download/${REGSYNC_VERSION}/regsync-linux-amd64" \
            -o /tmp/regsync
          echo "${REGSYNC_SHA256}  /tmp/regsync" | sha256sum -c -
          install -m 0755 /tmp/regsync /usr/local/bin/regsync

      - name: Sync images
        env:
          TARGET_REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          envsubst < regsync-config.yaml > regsync-config-tmp.yaml
          regsync once -c regsync-config-tmp.yaml
