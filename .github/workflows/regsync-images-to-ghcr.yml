name: Sync Images to GHCR

permissions:
  contents: read
  packages: write

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    branches:
      - main

env:
  REGISTRY: ghcr.io

# =============================================================================
# JOBS
# =============================================================================

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install regsync
        env:
          REGSYNC_VERSION: v0.10.0
          REGSYNC_SHA256: "b9e4298c1a5e5e0f2b2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f"
        run: |
          echo "Installing regsync ${REGSYNC_VERSION}..."
          curl -L "https://github.com/regclient/regclient/releases/download/${REGSYNC_VERSION}/regsync-linux-amd64" \
            -o /usr/local/bin/regsync
          echo "${REGSYNC_SHA256}  /usr/local/bin/regsync" | sha256sum --check
          chmod +x /usr/local/bin/regsync

      - name: Sync images
        env:
          TARGET_REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          envsubst < regsync-config.yaml > regsync-config-tmp.yaml
          regsync once -c regsync-config-tmp.yaml
