name: Sync Images to GHCR

permissions:
  contents: read
  packages: write

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# =============================================================================
# JOBS
# =============================================================================

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install regsync
        env:
          REGSYNC_VERSION: v0.10.0
          REGSYNC_SHA256: 2a4c0b1f4b3e8d9a7c6f2e1b5d8a3c9e4f7b2d6a8c1e5f9b3d7a2c6e4f8b1d5a
        run: |
          echo "Installing regsync ${REGSYNC_VERSION}..."
          curl -fsSL "https://github.com/regclient/regclient/releases/download/${REGSYNC_VERSION}/regsync-linux-amd64" \
            -o /tmp/regsync
          echo "${REGSYNC_SHA256}  /tmp/regsync" | sha256sum --check
          install -m 0755 /tmp/regsync /usr/local/bin/regsync

      - name: Sync images
        env:
          TARGET_REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          envsubst < regsync-config.yaml > regsync-config-tmp.yaml
          regsync once -c regsync-config-tmp.yaml
